<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e8d2b3">
  <title>Ceramic Tile Game</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #e8d2b3; }
    body { height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; padding: 2rem; background: #e8d2b3; color: #413f3b; font: 1rem/1.5 system-ui, sans-serif; text-align: center; }
    #status[hidden] { display: none; }
  </style>
  <script defer src="odin.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <canvas id="game" tabindex="0" role="application" aria-label="Tile game. Click, tap, or press Enter to change player count."></canvas>
  <div id="status" role="status" aria-live="polite">Loading the table…</div>
</body>
</html>
